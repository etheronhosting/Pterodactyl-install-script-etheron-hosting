name: Controles

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck draaien
        run: shellcheck -x install.sh lib/*.sh ui/*.sh installers/*.sh webui/*.sh tests/*.sh

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unittests Bash
        run: bash tests/lib_test.sh
      - name: Unittests webinstaller
        run: python3 tests/webui_test.py
      - name: JavaScript-syntax
        run: node --check webui/static/app.js
