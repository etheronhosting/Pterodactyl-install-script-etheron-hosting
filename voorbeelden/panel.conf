# Etheron Pterodactyl-installer: instellingen voor een panel
#
# Gebruik:
#   chmod 600 panel.conf
#   ./install.sh panel --config panel.conf
#
# Elke regel is SLEUTEL=waarde. Aanhalingstekens rond de waarde mogen.
# Commentaar alleen op een eigen regel die met # begint, niet achter een waarde.
# Een lege of weggelaten instelling krijgt de standaardwaarde tussen [haken].

# Domeinnaam (of IP-adres) van het panel. Verplicht.
FQDN=panel.voorbeeld.nl

# E-mailadres voor Let's Encrypt en als afzender in het panel. Verplicht.
EMAIL=beheer@voorbeeld.nl

# Firewall (UFW of firewalld) instellen met SSH, 80 en 443 open. [false]
FIREWALL=true

# HTTPS met Let's Encrypt. Met true ga je akkoord met de voorwaarden van
# Let's Encrypt: https://letsencrypt.org/repository/  [false]
LETSENCRYPT=true

# Nginx instellen voor een eigen certificaat in /etc/ssl/<FQDN>.pem en
# /etc/ssl/<FQDN>.key. Alleen als LETSENCRYPT=false. [false]
ASSUME_SSL=false

# Controleren of FQDN naar deze server wijst voordat er een certificaat wordt
# aangevraagd. Klopt het niet, dan stopt de installatie. [true]
VERIFY_DNS=true

# Panel-versie: 1 (stabiel) of 2 (experimenteel, pre-release). [1]
PANEL_VERSION=1

# Vaste release: een tag zoals v1.11.11 (v1) of een volledige commit-hash (v2).
# [nieuwste release]
PANEL_RELEASE=

# Tijdzone, zie configs/valid_timezones.txt. [Europe/Amsterdam]
TIMEZONE=Europe/Amsterdam

# Anonieme gebruiksstatistieken naar Pterodactyl sturen. [false]
TELEMETRY=false

# Database van het panel. [panel] [pterodactyl]
# Leeg wachtwoord = willekeurig wachtwoord; dat staat daarna in /var/www/pterodactyl/.env.
DB_NAME=panel
DB_USER=pterodactyl
DB_PASSWORD=

# Eerste beheerdersaccount. ADMIN_EMAIL is standaard gelijk aan EMAIL.
# Gebruikersnaam, namen en wachtwoord (minimaal 8 tekens) zijn verplicht.
ADMIN_EMAIL=
ADMIN_USERNAME=beheerder
ADMIN_FIRSTNAME=
ADMIN_LASTNAME=
ADMIN_PASSWORD=
