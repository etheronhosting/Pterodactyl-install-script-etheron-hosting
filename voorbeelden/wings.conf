# Etheron Pterodactyl-installer: instellingen voor een Wings-node
#
# Gebruik:
#   chmod 600 wings.conf
#   ./install.sh wings --config wings.conf
#
# Elke regel is SLEUTEL=waarde. Aanhalingstekens rond de waarde mogen.
# Commentaar alleen op een eigen regel die met # begint, niet achter een waarde.
# Een lege of weggelaten instelling krijgt de standaardwaarde tussen [haken].

# Firewall (UFW of firewalld) instellen met SSH, 8080 en 2022 open, plus 80
# en 443 als LETSENCRYPT=true. [false]
FIREWALL=true

# HTTPS voor Wings met Let's Encrypt. Met true ga je akkoord met de voorwaarden
# van Let's Encrypt: https://letsencrypt.org/repository/  [false]
LETSENCRYPT=true

# Domeinnaam van deze node en e-mailadres voor Let's Encrypt.
# Verplicht als LETSENCRYPT=true.
FQDN=node1.voorbeeld.nl
EMAIL=beheer@voorbeeld.nl

# Controleren of FQDN naar deze server wijst. Klopt het niet, dan stopt de
# installatie. [true]
VERIFY_DNS=true

# Vaste Wings-release, bijvoorbeeld v1.11.13. [nieuwste release]
WINGS_RELEASE=

# Databasehost-gebruiker aanmaken, zodat gameservers een eigen MySQL-database
# kunnen krijgen. Installeert MariaDB als dat nog niet aanwezig is. [false]
DBHOST=false

# Gebruikersnaam en wachtwoord van de databasehost. Wachtwoord verplicht als
# DBHOST=true. [pterodactyluser]
DBHOST_USER=pterodactyluser
DBHOST_PASSWORD=

# Vanaf waar de databasehost-gebruiker mag inloggen:
#   127.0.0.1   alleen vanaf deze server (standaard)
#   %           vanaf elk adres
#   een IP-adres of hostnaam, bijvoorbeeld het IP-adres van het panel
# Alles behalve 127.0.0.1 laat MariaDB op alle netwerkadressen luisteren.
DBHOST_ALLOW=127.0.0.1

# Poort 3306 openzetten in de firewall (alleen met FIREWALL=true). Is
# DBHOST_ALLOW een IP-adres, dan alleen voor dat adres. [false]
DBHOST_FIREWALL=false
