# Etheron Pterodactyl-installer: panel en Wings op dezelfde server
#
# Gebruik:
#   chmod 600 beide.conf
#   ./install.sh beide --config beide.conf
#
# Panel en Wings delen FQDN, EMAIL, FIREWALL en LETSENCRYPT; Wings gebruikt
# dan hetzelfde certificaat als het panel. Zie panel.conf en wings.conf voor
# uitleg en standaardwaarden van elke instelling.

FQDN=panel.voorbeeld.nl
EMAIL=beheer@voorbeeld.nl
FIREWALL=true
LETSENCRYPT=true
ASSUME_SSL=false
VERIFY_DNS=true

# Panel
PANEL_VERSION=1
PANEL_RELEASE=
TIMEZONE=Europe/Amsterdam
TELEMETRY=false
DB_NAME=panel
DB_USER=pterodactyl
DB_PASSWORD=
ADMIN_EMAIL=
ADMIN_USERNAME=beheerder
ADMIN_FIRSTNAME=
ADMIN_LASTNAME=
ADMIN_PASSWORD=

# Wings
WINGS_RELEASE=
DBHOST=false
DBHOST_USER=pterodactyluser
DBHOST_PASSWORD=
DBHOST_ALLOW=127.0.0.1
DBHOST_FIREWALL=false
